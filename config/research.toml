[archives]
wayback_cdx = "https://web.archive.org/cdx/search/cdx"
commoncrawl_catalogue = "https://index.commoncrawl.org/collinfo.json"
commoncrawl_index_template = "https://index.commoncrawl.org/{collection}-index"
user_agent = "degent-research/0.1 (polite public archive research)"

[roles]
tracks = ["fraud_analytics_strategy", "credit_risk_analytics", "quantitative_credit_risk_capital_modeling"]
entry_mid_levels = ["entry", "mid"]
exclude = ["investigative fraud", "AML casework", "FP&A", "trading quant", "manager", "intern", "staffing agency", "ML infrastructure"]
