timezone = "America/Chicago"
current_request_cap = 100
# New runs collect inventory without a document target. Optional positive limit:
# current_document_cap = 10
collection_runtime_seconds = 120
collection_byte_cap = 50_000_000
collection_storage_cap = 100_000_000
collection_response_bytes = 8_000_000
collection_chunk_size = 25
import_document_cap = 60
model_call_cap = 40
model_retry_cap = 2
sources = ["archives", "current"]
comparison_review = "reviewed"
comparison_status = "required_or_preferred"
comparison_scope = "qualification"
combinations = [["sql", "communication"], ["initiative", "everyday_ai_use"]]
data_dir = "data"
run_dir = "runs"
discovery_request_cap = 300
body_attempt_cap = 150
per_employer_body_attempts = 25
request_timeout_seconds = 30
retry_count = 2
host_delay_seconds = 2
codex_model = "gpt-6-luna"
codex_effort = "high"
review_model = "gpt-6.1-sol"
review_effort = "medium"
extract_document_cap = 30
initial_review_documents = 10
semantic_review_call_cap = 10
firecrawl_credit_cap = 20

