<script>
const steps=[{id:'prepare',label:'Prepare',theme:'Define the research.',italic:'Before the search.',sub:'Choose the companies, periods and limits for a reproducible run.',noun:'Scope & readiness'},{id:'discover',label:'Discover',theme:'Find the past.',italic:'One capture at a time.',sub:'Archive indexes produce candidates—not verified job observations.',noun:'Archive discovery'},{id:'recover',label:'Recover',theme:'From links to',italic:'usable evidence.',sub:'Retrieve bodies, check eligibility and resolve vacancy identity.',noun:'Evidence recovery'},{id:'extract',label:'Extract',theme:'Read what',italic:'was required.',sub:'Source passages sit beside their structured requirement mentions.',noun:'Requirement extraction'},{id:'review',label:'Review',theme:'Make every',italic:'decision traceable.',sub:'Human approval remains separate from automated validation.',noun:'Human review'},{id:'compare',label:'Compare',theme:'Observe changes.',italic:'Not assumptions.',sub:'Compare captures within vacancies, and shares across matched vacancies.',noun:'Historical comparison'},{id:'report',label:'Report',theme:'Share findings.',italic:'Keep the evidence.',sub:'Every reported claim carries its coverage, limitations and sources.',noun:'Research reports'}];
const records=[{id:'OBS-014',company:'Stripe',title:'Credit Risk Analyst',period:'2025',date:'2025-05-08',vacancy:'VAC-007',status:'Eligible',source:'Wayback',phrase:'Proficiency using SQL to analyze large datasets',concept:'SQL',required:'Required',review:'Pending'},{id:'OBS-020',company:'Affirm',title:'Fraud Strategy Analyst',period:'2024',date:'2024-09-11',vacancy:'VAC-012',status:'Eligible',source:'Common Crawl',phrase:'Experience with Python for analytical modeling',concept:'Python',required:'Required',review:'Approved (demo)'},{id:'OBS-026',company:'Block',title:'Credit Risk Modeling Analyst',period:'2023',date:'2023-12-04',vacancy:'VAC-016',status:'Eligible',source:'Wayback',phrase:'Experience evaluating predictive credit models',concept:'Model evaluation',required:'Preferred',review:'Pending'},{id:'OBS-031',company:'PayPal',title:'Fraud Risk Analyst',period:'2025',date:'2025-08-21',vacancy:'VAC-019',status:'Unclear',source:'Wayback',phrase:'Working knowledge of experimentation and risk signals',concept:'Experimentation',required:'Unclear',review:'Pending'},{id:'OBS-037',company:'SoFi',title:'Capital Analytics Associate',period:'2024',date:'2024-02-12',vacancy:'VAC-022',status:'Eligible',source:'Common Crawl',phrase:'Experience with quantitative financial analysis',concept:'Quantitative analysis',required:'Required',review:'Pending'},{id:'OBS-041',company:'Upstart',title:'Credit Strategy Analyst',period:'2026 H1',date:'2026-05-14',vacancy:'VAC-025',status:'Eligible',source:'Wayback',phrase:'Understanding of statistical modeling and SQL',concept:'Statistical modeling',required:'Preferred',review:'Pending'}];
const queryRows=[{id:'Q-044',name:'Stripe careers / 2025',meta:'Wayback · queried · 12 captures',v:'12 candidates'},{id:'Q-045',name:'Affirm Greenhouse / 2024',meta:'Common Crawl · queried · 8 captures',v:'8 candidates'},{id:'Q-046',name:'Block / Square careers / 2023',meta:'Wayback · blocked · HTTP 429',v:'Blocked'},{id:'Q-047',name:'SoFi careers / 2026',meta:'Common Crawl · successful-empty',v:'0 candidates'},{id:'Q-048',name:'PayPal careers / 2025',meta:'Wayback · not yet queried',v:'Unqueried'}];
const S={step:'discover',expanded:null,selectedId:'OBS-014',page:0,search:'',company:'All companies',period:'All periods',extractMethod:'Rules',reviewStatus:'Unclear',reviewNote:'',reviewSaved:false,reviewEdits:{},compareMode:'captures',filters:{},budgets:{discovery:300,bodies:150,extract:30,review:10},stageSwitch:false};
const root=document.getElementById('app');let toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function current(){return steps.find(x=>x.id===S.step)}
function dotPath(){return `<div class="stage-marker">${steps.map((a,i)=>`<span class="${i<steps.findIndex(x=>x.id===S.step)?'done':a.id===S.step?'active':''}"></span>`).join('')}</div>`}
function tile(cls,flex,content,open='',aria=''){return `<section class="tile ${cls}" style="flex:${flex} 1 0" ${open?`data-open="${open}" role="button" tabindex="0" aria-label="${esc(aria||'Expand '+open)}"`:''}>${content}${open?'<span aria-hidden="true" class="icon-arrow">↗</span>':''}</section>`}
function head(s,extra=''){return `<div class="tile-head"><span class="eyebrow">${s}</span>${extra}</div>`}
function pill(s,color=''){return `<span class="pill ${color}">${s}</span>`}
function number(v,label){return `<div class="number-cell"><div class="value">${v}</div><div class="name">${label}</div></div>`}
function row(s,v){return `<div class="plain-row"><strong>${s}</strong><span>${v}</span></div>`}
function bar(name,v,max){return `<div style="margin-top:12px"><div class="flexrow"><span class="tiny">${name}</span><strong style="font-size:11px;font-weight:600">${v} / ${max}</strong></div><div class="thin-track" style="margin-top:7px"><div class="thin-fill" style="width:${Math.min(100,v/max*100)}%"></div></div></div>`}
function evidence(){let rec=records.find(x=>x.id===S.selectedId)||records[0];return `<div class="doc-visual"><div class="flexrow"><span class="eyebrow" style="font-size:9px">${rec.id} · archive excerpt</span>${pill(rec.source)}</div><p class="doc-sentence">Our team works on analytical decision-making and building better risk systems.</p><p class="doc-sentence"><span class="doc-highlight">${esc(rec.phrase)}.</span> Build reliable analyses across risk and product teams.</p><div class="doc-bar"><i></i><i></i><i></i></div><div class="evidence-meta"><span>${rec.company} · ${rec.date}</span><span>Illustrative source</span></div></div>`}

function detailRight(id){if(id==='journey')return `${head('WHY SEVEN STATES')}<div class="spacer"></div><h2 class="section-title">Seven is enough<br><span class="serif">for the first version.</span></h2><div class="spacer"></div><p class="context-note">System checks live in Prepare. Classification and vacancy resolution live in Recover. Extraction validation lives with Extract, and human approval stays in Review.</p><p class="context-note">Errors and blocked sources appear where they occur, rather than becoming another separate dashboard.</p><div class="spacer"></div>${pill('No sidebar · no tile borders','blue')}`;
if(S.step==='prepare')return `${head('READINESS / ACTION')}<div class="spacer"></div><h2 class="section-title">A staged run,<br><span class="serif">not a blind launch.</span></h2><div class="spacer"></div>${row('Wayback','Not checked')}${row('Common Crawl','Not checked')}${row('Codex dependency','Optional')}${row('Worker controls','Not connected')}<div class="spacer"></div><button class="solid-button" data-action="check">Check readiness</button><p class="disabled-action">Execution requires a connected backend; this is a UI demonstration.</p>`;
if(S.step==='discover'){let x=queryRows.find(a=>a.id===S.selectedId)||queryRows[0];return `${head('QUERY OUTCOME')}<div class="spacer"></div><h2 class="section-title">${x.name}</h2><p class="context-note">${x.meta}</p><div class="spacer"></div>${row('Query ID',x.id)}${row('Type','Archive index')}${row('Records discovered',x.v)}${row('Relevance','Not yet validated')}<div class="spacer"></div><p class="context-note">An empty successful search is different from blocked or unattempted discovery.</p>`}
if(S.step==='recover'){let a=records.find(x=>x.id===S.selectedId)||records[0];return `${head('ELIGIBILITY & IDENTITY')}<div class="spacer"></div><h2 class="section-title">${a.company}<br><span class="serif">${a.title}</span></h2><div class="spacer"></div>${row('Record',a.id)}${row('Vacancy ID',a.vacancy)}${row('Capture',a.date)}${row('Screening',a.status)}${row('Brand','Employer + posting brand separate')}<div class="spacer"></div><p class="context-note">Publication date is unknown. Capture and retrieval are different timestamps.</p>`}
if(S.step==='extract'){let a=records.find(x=>x.id===S.selectedId)||records[0];return `${head('STRUCTURED REQUIREMENT')}<div class="spacer"></div><h2 class="section-title">${a.concept}</h2><div class="spacer"></div>${row('Status',a.required)}${row('Evidence','Explicit · synthetic')}${row('Extraction method','Rules')}${row('Schema','Valid (demo)')}${row('Human approval','Pending')}<div class="spacer"></div><p class="context-note">No confidence percentage has been inferred.</p><button class="solid-button" data-action="go-review">Review this requirement →</button>`}
if(S.step==='review')return `${head('REVIEW ACTION')}<div class="spacer"></div><h2 class="section-title">Choose the<br><span class="serif">supported status.</span></h2><div class="spacer"></div><div class="review-options">${['Required','Preferred','Unclear'].map(x=>`<button data-action="set-review" data-value="${x}" class="${S.reviewStatus===x?'chosen':''}">${x}</button>`).join('')}</div><p class="context-note">Automated schema valid · human approval ${S.reviewSaved?'approved locally':'pending'}.</p><div class="spacer"></div><button class="solid-button" data-action="save-review">Approve demo edit →</button><p class="disabled-action">Session-only. Persistent review and audit logging require backend storage.</p>`;
if(S.step==='compare')return `${head('INTERPRETATION')}<div class="spacer"></div><h2 class="section-title">The gap is<br><span class="serif">not evidence.</span></h2><div class="spacer"></div>${row('Edit date','Unknown')}${row('Same vacancy','VAC-007 (demo)')}${row('Newly mentioned','Python')}${row('No longer stated','Not proven removed')}<div class="spacer"></div><p class="context-note">Percentage shares require at least five extracted distinct vacancies. This is a display rule, not representativeness.</p>`;
return `${head('DOWNLOAD / SCOPE')}<div class="spacer"></div><h2 class="section-title">Evidence first.<br><span class="serif">Limitations intact.</span></h2><div class="spacer"></div>${row('CSV','Requirement records')}${row('JSON','Run manifest and records')}${row('Markdown','Summary template')}${row('Source anchors','Illustrative IDs only')}<div class="spacer"></div><button class="solid-button" data-action="export-json">Export demo JSON ↓</button>`}
function expanded(){let id=S.expanded;root.innerHTML=`<main class="expanded" aria-label="Expanded ${detailHeading(id)} workspace"><section class="tile tone-blue">${detailLeft(id)}</section><section class="tile tone-ivory detail-pane">${detailCenter(id)}</section><section class="tile tone-cream">${detailRight(id)}</section></main>`;}
function render(){S.expanded?expanded():mosaic()}
function showToast(s){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=s;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2700)}
function exportFile(mode){let text,filename,mime;if(mode==='json'){text=JSON.stringify({notice:'SYNTHETIC FRONTEND DEMO — NOT HISTORICAL EVIDENCE',pipeline_connected:false,run:'DEMO-001',stage:S.step,counts:{candidates:188,attempted:91,eligible_captures:42,distinct_vacancies:27,extracted_docs:24},records,limits:['Index records are only candidates','Omission is not proof of requirement removal','Captured dates are not employer edit dates','Partial periods excluded from completed comparisons']},null,2);filename='degent-demo-evidence.json';mime='application/json'}else{text=['record_id,company,title,capture_date,vacancy_id,requirement,status,review',...records.map(x=>[x.id,x.company,x.title,x.date,x.vacancy,'"'+x.concept+'"',x.required,x.review].join(','))].join('\n');filename='degent-demo-requirements.csv';mime='text/csv'}let a=document.createElement('a');let u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);showToast('Downloaded synthetic demo data')}
function changeStep(n){let i=steps.findIndex(x=>x.id===S.step);S.step=steps[(i+n+steps.length)%steps.length].id;S.expanded=null;S.page=0;S.search='';render()}
root.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){let a=b.dataset.action;let v=b.dataset.value;e.stopPropagation();switch(a){case'prev':changeStep(-1);break;case'next':changeStep(1);break;case'stage':S.step=v;S.expanded=null;S.page=0;S.search='';render();break;case'journey':S.expanded='journey';render();break;case'close':S.expanded=null;S.search='';S.page=0;render();break;case'open-config':S.expanded='config';render();break;case'check':showToast('Backend not connected. Readiness checks require an API.');break;case'set-review':S.reviewStatus=v;render();break;case'save-review':S.reviewSaved=true;S.reviewEdits[S.selectedId]={status:S.reviewStatus,note:S.reviewNote,sessionOnly:true};showToast('Approved in demo session only');render();break;case'go-review':S.step='review';S.expanded='primary';render();break;case'export-json':exportFile('json');break;case'export-csv':exportFile('csv');break;case'select-row':S.selectedId=v;render();break;case'page-prev':S.page=Math.max(0,S.page-1);render();break;case'page-next':S.page++;render();break;case'comparison':S.compareMode=v;render();break;case'passage-prev':S.filters.passage=Math.max(1,(S.filters.passage||1)-1);render();break;case'passage-next':S.filters.passage=Math.min(3,(S.filters.passage||1)+1);render();break;case'toggle-company':b.classList.toggle('selected');break;}return}
let tile=e.target.closest('[data-open]');if(tile&&!e.target.closest('button,input,select,textarea')){S.expanded=tile.dataset.open;S.page=0;S.search='';render()}});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.budget){S.budgets[t.dataset.budget]=Math.max(0,Math.min(1000,Number(t.value)||0));showToast('Budget changed in demo state')}else if(t.dataset.field==='period'){S.period=t.value;render()}else if(t.dataset.field==='reviewNote'){S.reviewNote=t.value}});
root.addEventListener('input',e=>{const t=e.target;if(t.dataset.field==='search'){const a=t.selectionStart||0;S.search=t.value;S.page=0;render();let f=document.getElementById('record-search');if(f){f.focus();f.setSelectionRange(a,a)}}else if(t.dataset.field==='reviewNote'){S.reviewNote=t.value}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target.closest('[data-open]');if(t){e.preventDefault();S.expanded=t.dataset.open;S.page=0;render()}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.expanded){S.expanded=null;render()}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();changeStep(1)}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();changeStep(-1)}});
render();
</script>
</body>
</html>
